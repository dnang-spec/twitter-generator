<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1d9bf0">
    <meta name="description" content="트위터 인텐트 링크 도구">
    <title>트위터 링크 생성기</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
            background: linear-gradient(135deg, #e0f2fe 0%, #bfdbfe 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            padding: 40px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .icon {
            width: 50px;
            height: 50px;
            background: #1d9bf0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 {
            font-size: 28px;
            color: #1f2937;
        }

        .install-banner {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: none;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
            animation: slideDown 0.3s ease;
        }

        .install-banner.show {
            display: flex;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .install-text {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 15px;
            font-weight: 500;
        }

        .install-btn {
            background: white;
            color: #059669;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .install-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        .close-btn {
            background: transparent;
            color: white;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 5px 10px;
            margin-left: 10px;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .close-btn:hover {
            opacity: 1;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #d1d5db;
            border-radius: 10px;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #1d9bf0;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background: #1d9bf0;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #1a8cd8;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .result {
            margin-top: 30px;
            padding: 25px;
            background: #f9fafb;
            border-radius: 12px;
            border: 2px solid #e5e7eb;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .result.show {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .result-header h3 {
            font-size: 18px;
            color: #1f2937;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-copy {
            background: #374151;
            color: white;
        }

        .btn-copy:hover {
            background: #1f2937;
        }

        .btn-copy.copied {
            background: #10b981;
        }

        .btn-test {
            background: #1d9bf0;
            color: white;
        }

        .btn-test:hover {
            background: #1a8cd8;
        }

        .link-box {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #374151;
        }

        .tips {
            margin-top: 30px;
            padding: 20px;
            background: #dbeafe;
            border-radius: 12px;
            border: 1px solid #93c5fd;
        }

        .tips h4 {
            color: #1e3a8a;
            margin-bottom: 12px;
            font-size: 16px;
        }

        .tips ul {
            list-style: none;
            color: #1e40af;
            font-size: 14px;
            line-height: 1.8;
        }

        .tips li {
            padding-left: 20px;
            position: relative;
        }

        .tips li:before {
            content: "•";
            position: absolute;
            left: 5px;
        }

        @media (max-width: 640px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 22px;
            }

            .button-group {
                flex-direction: column;
            }

            .btn-small {
                width: 100%;
                justify-content: center;
            }

            .install-banner {
                flex-direction: column;
                gap: 12px;
                text-align: center;
            }

            .install-text {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 앱 설치 배너 -->
        <div class="install-banner" id="installBanner">
            <div class="install-text">
                <span>📱</span>
                <span>앱으로 설치하고 더 편하게 사용하세요!</span>
            </div>
            <div style="display: flex; align-items: center;">
                <button class="install-btn" id="installBtn">설치하기</button>
                <button class="close-btn" id="closeBanner">×</button>
            </div>
        </div>

        <div class="header">
            <div class="icon">
                <svg width="24" height="24" fill="white" viewBox="0 0 24 24">
                    <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                </svg>
            </div>
            <h1>트위터 인텐트 링크 생성기</h1>
        </div>

        <div class="form-group">
            <label>트윗 내용 (엔터로 줄바꿈 가능)</label>
            <textarea id="text" placeholder="여기에 트윗 내용을 입력하세요.
엔터를 누르면 줄바꿈이 됩니다!"></textarea>
        </div>

        <div class="form-group">
            <label>공유할 URL (선택사항)</label>
            <input type="text" id="url" placeholder="https://example.com">
        </div>

        <div class="form-group">
            <label>해시태그 (# 없이, 쉼표로 구분)</label>
            <input type="text" id="hashtags" placeholder="뉴스, 정보, 트위터">
        </div>

        <div class="form-group">
            <label style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="shortenUrl" style="width: auto; margin: 0;">
                <span>링크 단축하기 (짧은 URL 생성)</span>
            </label>
        </div>

        <button class="btn" onclick="generateLink()">링크 생성하기</button>

        <div class="result" id="result">
            <div class="result-header">
                <h3>생성된 링크</h3>
                <div class="button-group">
                    <button class="btn-small btn-copy" id="copyBtn" onclick="copyLink()">
                        <span id="copyIcon">📋</span>
                        <span id="copyText">복사</span>
                    </button>
                    <button class="btn-small btn-test" onclick="testLink()">
                        🔗 테스트
                    </button>
                </div>
            </div>
            <div class="link-box" id="linkBox"></div>
        </div>

        <div class="tips">
            <h4>💡 사용 팁</h4>
            <ul>
                <li>트윗 내용에서 엔터를 누르면 실제 트윗에서도 줄바꿈이 적용됩니다</li>
                <li>생성된 링크를 웹사이트, 블로그, 이메일 등에 삽입하세요</li>
                <li>"테스트" 버튼으로 실제로 어떻게 보이는지 확인할 수 있습니다</li>
                <li>링크 단축 기능으로 짧고 깔끔한 URL을 만들 수 있어요 (예: tinyurl.com/abc123)</li>
                <li>앱으로 설치하면 오프라인에서도 사용 가능합니다</li>
            </ul>
        </div>
    </div>

    <script>
        let generatedLink = '';
        let deferredPrompt;

        // PWA 설치 프롬프트
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBanner').classList.add('show');
        });

        // 설치 버튼 클릭
        document.getElementById('installBtn').addEventListener('click', async () => {
            if (!deferredPrompt) return;
            
            deferredPrompt.prompt();
            const { outcome } = await deferredPrompt.userChoice;
            
            if (outcome === 'accepted') {
                console.log('앱 설치됨');
            }
            
            deferredPrompt = null;
            document.getElementById('installBanner').classList.remove('show');
        });

        // 배너 닫기
        document.getElementById('closeBanner').addEventListener('click', () => {
            document.getElementById('installBanner').classList.remove('show');
        });

        // 링크 생성
        function generateLink() {
            const text = document.getElementById('text').value;
            const url = document.getElementById('url').value;
            const hashtags = document.getElementById('hashtags').value;
            const shouldShorten = document.getElementById('shortenUrl').checked;

            let intentUrl = 'https://twitter.com/intent/tweet?';
            const params = [];

            if (text.trim()) {
                params.push('text=' + encodeURIComponent(text));
            }
            if (url.trim()) {
                params.push('url=' + encodeURIComponent(url));
            }
            if (hashtags.trim()) {
                params.push('hashtags=' + encodeURIComponent(hashtags));
            }

            intentUrl += params.join('&');
            
            if (shouldShorten) {
                // URL 단축 서비스 사용
                shortenUrl(intentUrl);
            } else {
                generatedLink = intentUrl;
                displayResult(intentUrl);
            }

            resetCopyButton();
        }

        // URL 단축 함수
        async function shortenUrl(longUrl) {
            try {
                document.getElementById('linkBox').textContent = '단축 URL 생성 중...';
                document.getElementById('result').classList.add('show');
                
                // TinyURL API 사용
                const response = await fetch(`https://tinyurl.com/api-create.php?url=${encodeURIComponent(longUrl)}`);
                const shortUrl = await response.text();
                
                generatedLink = shortUrl;
                displayResult(shortUrl);
            } catch (error) {
                console.error('URL 단축 실패:', error);
                generatedLink = longUrl;
                displayResult(longUrl + '\n\n⚠️ 단축 실패: 원본 URL을 표시합니다');
            }
        }

        // 결과 표시 함수
        function displayResult(url) {
            document.getElementById('linkBox').textContent = url;
            document.getElementById('result').classList.add('show');
        }

        // 링크 복사
        function copyLink() {
            navigator.clipboard.writeText(generatedLink).then(() => {
                const btn = document.getElementById('copyBtn');
                const icon = document.getElementById('copyIcon');
                const text = document.getElementById('copyText');
                
                btn.classList.add('copied');
                icon.textContent = '✓';
                text.textContent = '복사됨!';

                setTimeout(resetCopyButton, 2000);
            });
        }

        // 복사 버튼 초기화
        function resetCopyButton() {
            const btn = document.getElementById('copyBtn');
            const icon = document.getElementById('copyIcon');
            const text = document.getElementById('copyText');
            
            btn.classList.remove('copied');
            icon.textContent = '📋';
            text.textContent = '복사';
        }

        // 테스트 (새 창에서 열기)
        function testLink() {
            if (generatedLink) {
                window.open(generatedLink, '_blank');
            }
        }

        // 서비스 워커 등록 (오프라인 지원)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'twitter-generator-v1';
                    const urlsToCache = ['/'];
                    
                    self.addEventListener('install', event => {
                        event.waitUntil(
                            caches.open(CACHE_NAME)
                                .then(cache => cache.addAll(urlsToCache))
                        );
                    });
                    
                    self.addEventListener('fetch', event => {
                        event.respondWith(
                            caches.match(event.request)
                                .then(response => response || fetch(event.request))
                        );
                    });
                `;
                
                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);
                
                navigator.serviceWorker.register(swUrl);
            });
        }

        // manifest 동적 생성
        const manifestData = {
            name: "트위터 링크 생성기",
            short_name: "트위터 링크",
            start_url: "./",
            display: "standalone",
            background_color: "#ffffff",
            theme_color: "#1d9bf0",
            description: "트위터 인텐트 링크 도구",
            icons: [
                {
                    src: "data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMTkyIiBoZWlnaHQ9IjE5MiIgdmlld0JveD0iMCAwIDE5MiAxOTIiIGZpbGw9IiMxZDliZjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjE5MiIgaGVpZ2h0PSIxOTIiIGZpbGw9IiMxZDliZjAiIHJ4PSI0MCIvPjxwYXRoIGQ9Ik0xNDUuNiAzNi40aDQ5LjZsLTEwOC40IDEyMy45TDE5OCAyMDEuNmgtMzMuN2wtNzguMi0xMDIuMi03My40IDEwMi4ySDIuNWwxMTYtMTMyLjZMMi41IDM2LjRoNTEuNWw3MC43IDkzLjV6bS0xNy40IDI2LjNoMjcuNUw1My40IDYzLjhoLTI5LjZ6IiBmaWxsPSJ3aGl0ZSIvPjwvc3ZnPg==",
                    sizes: "192x192",
                    type: "image/svg+xml"
                },
                {
                    src: "data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNTEyIiBoZWlnaHQ9IjUxMiIgdmlld0JveD0iMCAwIDUxMiA1MTIiIGZpbGw9IiMxZDliZjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PHJlY3Qgd2lkdGg9IjUxMiIgaGVpZ2h0PSI1MTIiIGZpbGw9IiMxZDliZjAiIHJ4PSIxMDgiLz48cGF0aCBkPSJNMzg4IDk3aDEzMi41bC0yODkgMzMxTDUyOCA1MzloLTkwbC0yMDguNS0yNzIuNUwzOSA1MzlILTE5LjVsMzA5LTM1My41TDMzIDk3aDkyLjRsMTg4LjQgMjQ5em0tNDMuOCA3MGg3My40TDE0MS43IDQ2OS4yaC03OXoiIGZpbGw9IndoaXRlIi8+PC9zdmc+",
                    sizes: "512x512",
                    type: "image/svg+xml"
                }
            ]
        };

        const manifestBlob = new Blob([JSON.stringify(manifestData)], { type: 'application/json' });
        const manifestURL = URL.createObjectURL(manifestBlob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);
    </script>
</body>
</html>
